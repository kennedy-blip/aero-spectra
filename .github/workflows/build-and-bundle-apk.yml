name: Build and bundle Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install web dependencies
        run: npm ci
      - name: Check Svelte, JavaScript and zero-TypeScript policy
        run: npm run check && npm run audit:zero-ts
      - name: Run JavaScript and Python tests
        run: npm test && npm run test:python
      - name: Build web assets for Vercel and Capacitor
        env:
          VITE_AERO_API_BASE_URL: ${{ vars.VITE_AERO_API_BASE_URL }}
        run: npm run build
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Assemble installable release APK
        run: gradle -p android :app:assembleRelease
      - name: Bundle APK for the web release directory
        run: |
          mkdir -p static/releases
          cp android/app/build/outputs/apk/release/app-release.apk static/releases/aero-spectra-v1.21.0-universal.apk
          sha256sum static/releases/aero-spectra-v1.21.0-universal.apk | tee static/releases/aero-spectra-v1.21.0-universal.apk.sha256
          npm run build
      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aero-spectra-v1.21.0-android-apk
          path: |
            static/releases/aero-spectra-v1.21.0-universal.apk
            static/releases/aero-spectra-v1.21.0-universal.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              static/releases/aero-spectra-v1.21.0-universal.apk \
              static/releases/aero-spectra-v1.21.0-universal.apk.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              static/releases/aero-spectra-v1.21.0-universal.apk \
              static/releases/aero-spectra-v1.21.0-universal.apk.sha256 \
              --title "AERO-SPECTRA $GITHUB_REF_NAME" --generate-notes
          fi
